   services:
     - type: web
       name: erp-inventario
       runtime: node
       plan: free
       rootDir: erp-inventario
       buildCommand: npm run build
       startCommand: npm start
       healthCheckPath: /api/health
       envVars:
         - key: NODE_ENV
           value: production
         - key: DATABASE_URL
           sync: false
         - key: JWT_SECRET
           generateValue: true
         - key: JWT_EXPIRES_IN
           value: 8h
